services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH in .env}
      # Neo4j maps every NEO4J_* variable onto a server setting. NEO4J_PASSWORD is not a setting and fails startup.
      FT_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$FT_NEO4J_PASSWORD\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  neo4j_data:
