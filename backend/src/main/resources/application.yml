spring:
  application:
    name: familytree
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:familytree-dev-password}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
